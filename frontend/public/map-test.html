<!DOCTYPE html>
<html>
<head>
<title>Leaflet Tile Test</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
#map { width: 100%; height: 600px; }
body { margin: 0; padding: 10px; font-family: sans-serif; background: #111; color: #eee; }
#info { padding: 10px; font-size: 14px; }
</style>
</head>
<body>
<div id="info">Testing tile providers...</div>
<div id="esri-info">Testing Esri...</div>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const info = document.getElementById('info');
const map = L.map('map').setView([-1.85, 109.97], 12);

// Try OpenStreetMap
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OSM',
  maxZoom: 19
}).addTo(map);

// Try Esri
const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Esri',
  maxZoom: 18
});
esri.on('tileload', () => { document.getElementById('esri-info').textContent = 'Esri tile loaded OK!'; });
esri.on('tileerror', (e) => { document.getElementById('esri-info').textContent = 'Esri error: ' + e; });
esri.addTo(map);

// Add zone polygon
L.polygon([
  [-1.832, 109.955],
  [-1.832, 109.975],
  [-1.858, 109.975],
  [-1.858, 109.955],
], {color: '#14b8a6', fillOpacity: 0.3}).addTo(map).bindPopup('Zone A');
</script>
</body>
</html>
